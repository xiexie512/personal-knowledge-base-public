plugins {
    id 'fabric-loom' version '1.6.13'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.dafatfish.afkmover'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    version = '1.21.1'
    mappings = 'net.fabricmc:intermediary:1.21.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'fabric.dli.config', 'net.fabricmc.loader.impl.launch.knot.KnotClientInstance'
        }
        server {
            workingDirectory project.file('run')
            property 'fabric.dli.config', 'net.fabricmc.loader.impl.launch.knot.KnotServerInstance'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:intermediary:1.21.1'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modApi 'net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1'
    include 'net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Fabric-Mod': 'fabric.mod.json',
            'Mod-Version': version,
            'Mod-ID': 'afkmover'
        )
    }
}